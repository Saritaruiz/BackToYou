<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create {{ report_type_label }} Report | BackToYou</title>
</head>
<body>
    <h1>Create {{ report_type_label }} Item Report</h1>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.non_field_errors }}

        {% for field in form %}
            <p>
                {{ field.label_tag }}
                {{ field }}
                {{ field.errors }}
            </p>
        {% endfor %}

        <button type="submit">Submit Report</button>
    </form>

    <p>
        <a href="{% url 'reports:report_list' %}">Back to reports</a>
    </p>
</body>
</html>
