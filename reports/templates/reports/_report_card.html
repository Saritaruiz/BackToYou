<article class="card">
    {% if report.image %}
        <img
            class="report-image"
            src="{{ report.image.url }}"
            alt="{{ report.title }}"
        >
    {% endif %}

    <div class="card-body">
        <span class="status-pill">{{ report.get_status_display }}</span>
        <h2>{{ report.title }}</h2>
        <div class="meta-grid">
            <div class="meta-item">
                <span class="meta-label">Type</span>
                {{ report.get_report_type_display }}
            </div>
            <div class="meta-item">
                <span class="meta-label">Category</span>
                {{ report.category.name }}
            </div>
            <div class="meta-item">
                <span class="meta-label">Location</span>
                {{ report.location }}
            </div>
            <div class="meta-item">
                <span class="meta-label">Date</span>
                {{ report.event_date }}
            </div>
        </div>
        <p class="description">{{ report.description|truncatewords:24 }}</p>
        <a class="button" href="{% url 'reports:report_detail' report.id %}">
            View Details
        </a>
    </div>
</article>
