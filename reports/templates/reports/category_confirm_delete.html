{% extends "base.html" %}

{% block title %}Delete {{ category.name }} | BackToYou{% endblock %}

{% block content %}
    <section class="form-card">
        <h1 class="page-title">Delete this category?</h1>
        <p class="lead">
            Categories currently used by reports cannot be deleted.
        </p>

        <div class="meta-grid">
            <div class="meta-item">
                <span class="meta-label">Category name</span>
                {{ category.name }}
            </div>
        </div>

        <div class="actions">
            <form method="post">
                {% csrf_token %}
                <button class="danger" type="submit">Delete category</button>
            </form>
            <a class="button ghost" href="{% url 'administration_category_list' %}">
                Cancel
            </a>
        </div>
    </section>
{% endblock %}
