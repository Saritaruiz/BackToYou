<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Reporter | BackToYou</title>
</head>
<body>
    <h1>Contact Reporter</h1>

    <p>
        <strong>Report:</strong>
        {{ report.title }}
    </p>

    <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}

        {% for field in form %}
            <p>
                {{ field.label_tag }}
                {{ field }}
                {{ field.errors }}
            </p>
        {% endfor %}

        <button type="submit">Send Message</button>
    </form>

    <p>
        <a href="{% url 'reports:report_detail' report.id %}">
            Back to report
        </a>
    </p>
</body>
</html>
