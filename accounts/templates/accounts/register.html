<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | BackToYou</title>
</head>
<body>
    <h1>Register</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}

        {% for field in form %}
            <p>
                {{ field.label_tag }}
                {{ field }}
                {{ field.errors }}
            </p>
        {% endfor %}

        <button type="submit">Register</button>
    </form>

    <p>
        Already registered?
        <a href="{% url 'accounts:login' %}">Login</a>
    </p>

    <p>
        <a href="{% url 'home' %}">Home</a>
    </p>
</body>
</html>
