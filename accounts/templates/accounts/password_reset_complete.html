{% extends "base.html" %}

{% block title %}Password changed | BackToYou{% endblock %}

{% block content %}
    <section class="form-card">
        <span class="kicker">Done</span>
        <h1 class="page-title">Your password was changed.</h1>
        <p class="lead">You can log in now with your new password. The link you used no longer works.</p>

        <div class="actions">
            <a class="button" href="{% url 'accounts:login' %}">Login</a>
        </div>
    </section>
{% endblock %}
