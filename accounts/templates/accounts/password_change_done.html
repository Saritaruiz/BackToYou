{% extends "base.html" %}

{% block title %}Password changed | BackToYou{% endblock %}

{% block content %}
    <section class="form-card">
        <span class="kicker">Done</span>
        <h1 class="page-title">Your password was changed.</h1>
        <p class="lead">You are still logged in. Next time, use your new password.</p>

        <div class="actions">
            <a class="button" href="{% url 'reports:my_reports' %}">Go to My Reports</a>
            <a class="button ghost" href="{% url 'home' %}">Back to Home</a>
        </div>
    </section>
{% endblock %}
