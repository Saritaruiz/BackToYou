{# RF01/RF39: ver lo que se escribe evita errores al elegir o escribir la contrasena. Va dentro del <form>. #}
<label class="show-password">
    <input type="checkbox" data-show-password>
    Show password
</label>
<script>
    (function (box) {
        const form = box.form;
        function show(visible) {
            form.querySelectorAll("input[data-password-field]").forEach(function (field) {
                field.type = visible ? "text" : "password";
            });
        }
        form.querySelectorAll('input[type="password"]').forEach(function (field) {
            field.setAttribute("data-password-field", "");
        });
        box.addEventListener("change", function () { show(box.checked); });
        // Al enviar vuelven a ser campos de contrasena, para que el navegador
        // no guarde lo escrito como texto comun.
        form.addEventListener("submit", function () { show(false); });
    })(document.currentScript.previousElementSibling.querySelector("[data-show-password]"));
</script>
