{# Campos de un formulario de cuenta, con la ayuda de Django (p. ej. las reglas de contrasena). #}
{{ form.non_field_errors }}
{% for field in form %}
    <div class="form-field">
        {{ field.label_tag }}
        {{ field }}
        {% if field.help_text %}
            <div class="field-help">{{ field.help_text|safe }}</div>
        {% endif %}
        {{ field.errors }}
    </div>
{% endfor %}
