# Nginx recibe las visitas, sirve el CSS y las fotos, y le pasa el resto a
# Gunicorn. deploy/setup.sh lo copia la primera vez a
# /etc/nginx/sites-available/backtoyou. Despues no lo vuelve a copiar, para
# no borrar el HTTPS que agrega certbot.

server {
    listen 80 default_server;
    server_name _;

    # El formulario acepta fotos de hasta 5 MB (reports/forms.py) y Nginx
    # por defecto rechaza todo lo que pase de 1 MB.
    client_max_body_size 6M;

    location /static/ {
        alias /home/ubuntu/BackToYou/staticfiles/;
    }

    location /media/ {
        alias /home/ubuntu/BackToYou/media_local/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Django lo lee en SECURE_PROXY_SSL_HEADER (settings.py).
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
